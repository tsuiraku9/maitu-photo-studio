[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maitu-photo-studio"
version = "0.1.0"
description = "MaiBot realistic photo generation and reference gallery plugin"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "maibot-plugin-sdk>=2.7.1,<3.0.0",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".dev"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.format]
quote-style = "double"
